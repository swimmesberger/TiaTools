name: release
# Builds the Windows and Mac programs for a version tag and attaches them to its GitHub release. See docs/releasing.md.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
env:
  # On a tag, the packer checks that it is the viewer's version; a run on a branch packs without a release.
  TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v6.1.0
        with:
          global-json-file: global.json
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
      - name: Put vswhere on the PATH, which the Native AOT link needs
        shell: pwsh
        run: Add-Content $env:GITHUB_PATH "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer"
      - name: Publish the viewer
        run: dotnet publish src/TiaViewer -c Release -r win-x64 -o artifacts/publish/viewer
      - name: Publish tiadump
        run: dotnet publish src/TiaDump -c Release -r win-x64 -o artifacts/publish/tiadump
      - name: Check that tiadump starts
        run: artifacts/publish/tiadump/tiadump.exe --help
      - name: Pack the zips
        shell: bash
        run: python tools/package_release.py --rid win-x64 --viewer artifacts/publish/viewer --tiadump artifacts/publish/tiadump --out artifacts/release ${TAG:+--tag "$TAG"}
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: release-win-x64
          path: artifacts/release/*.zip

  macos:
    # Microsoft's SDK from setup-dotnet, which bundle.sh --universal requires; one Mac builds for Apple silicon and Intel.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v6.1.0
        with:
          global-json-file: global.json
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
      - name: Build and pack the zips
        run: tools/release_macos.sh ${TAG:+--tag "$TAG"}
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: release-macos-universal
          path: artifacts/release/*.zip

  release:
    if: github.ref_type == 'tag'
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: release-*
          merge-multiple: true
          path: release
      - name: Attach them to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # A new tag gets a draft release, to be given notes and published by hand; an existing release gets its zips replaced.
          gh release view "$TAG" > /dev/null 2>&1 || gh release create "$TAG" --verify-tag --draft --title "TiaTools ${TAG#v}" --generate-notes
          gh release upload "$TAG" release/*.zip --clobber
